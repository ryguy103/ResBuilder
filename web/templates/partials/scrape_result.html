<form hx-post="/generate" hx-target="#result-container" hx-swap="innerHTML" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
    <div class="flex items-start gap-3 p-4 bg-green-50 rounded-lg border border-green-200">
        <svg class="h-5 w-5 text-green-500 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-green-800">Job posting scraped successfully</p>
            <p class="text-xs text-green-600 mt-0.5">{{ char_count|default(0) }} characters extracted</p>
        </div>
    </div>

    <div class="grid gap-6 sm:grid-cols-2">
        <div>
            <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
            <input 
                type="text" 
                name="company" 
                id="company"
                value="{{ company }}"
                required
                placeholder="Acme Inc."
                class="w-full rounded-lg border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-sm"
            >
        </div>
        <div>
            <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role Title</label>
            <input 
                type="text" 
                name="role" 
                id="role"
                value="{{ role }}"
                required
                placeholder="Senior Engineer"
                class="w-full rounded-lg border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-sm"
            >
        </div>
    </div>

    <div>
        <label for="job_description" class="block text-sm font-medium text-gray-700 mb-1">Job Description</label>
        <textarea 
            name="job_description" 
            id="job_description"
            rows="12"
            required
            class="w-full rounded-lg border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 text-sm font-mono"
        >{{ job_description }}</textarea>
        <p class="mt-1 text-xs text-gray-500">
            <span id="char-count">{{ char_count|default(0) }}</span> characters
        </p>
    </div>

    <input type="hidden" name="url" id="url" value="{{ url }}">

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200">
        <a href="/" class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
            Cancel
        </a>
        <button 
            type="submit"
            class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 transition-colors"
        >
            <span class="htmx-indicator">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
            </svg>
            Generate Application
        </button>
    </div>
</form>

<script>
    const textarea = document.getElementById('job_description');
    const counter = document.getElementById('char-count');
    
    function updateCounter() {
        counter.textContent = textarea.value.length;
    }
    
    textarea.addEventListener('input', updateCounter);
</script>
