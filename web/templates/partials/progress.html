<div 
    class="bg-white rounded-xl shadow-sm border-2 border-primary-200 p-8 animate-pulse-border"
    hx-get="/status/{{ task_id }}"
    hx-trigger="every 2s"
    hx-swap="outerHTML"
>
    <div class="flex flex-col items-center text-center">
        <div class="relative">
            <svg class="animate-spin h-12 w-12 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        
        <h3 class="mt-6 text-lg font-semibold text-gray-900">{{ message }}</h3>
        
        <div class="mt-6 w-full max-w-xs">
            <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>Progress</span>
                <span>{{ progress }}%</span>
            </div>
            <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-full bg-primary-600 rounded-full transition-all duration-500" style="width: {{ progress }}%"></div>
            </div>
        </div>
        
        <p class="mt-4 text-xs text-gray-400">
            Almost there...
        </p>
    </div>
</div>
